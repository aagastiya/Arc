name: Weekly article cleanup

on:
  schedule:
    # Sunday 02:00 UTC — replaces the former Vercel cleanup cron.
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run cleanup
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/admin/cleanup"
